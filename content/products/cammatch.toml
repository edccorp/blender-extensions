    "Official CamMatch™ Professional software package",
    "One year of software updates",
    "Official documentation",
    "Instant delivery — your license token arrives the moment you purchase",
]

requirements = [
    "Blender 5.0 or newer",
    "OpenCV — installs automatically from the panel on first run (Windows, macOS, and Linux)",
]

[[sections]]
title = "Professional Certification (offered separately)"
body = """The CamMatch™ Professional Certification Program teaches the \
complete camera matching workflow inside Blender, including 2D image \
markers, 3D control points, object linking, camera calibration, camera pose \
solving, reprojection error analysis, diagnostic visualization, and best \
practices for forensic visualization — live, virtual, and instructor-led, \
with practice Blender projects and datasets, and an official CamMatch™ \
Professional Certificate upon successful completion.

Certification sessions are scheduled periodically by Engineering Dynamics \
Company based on demand, with class sizes intentionally limited for \
personalized instruction and interactive Q&A. Contact info@edccorp.com \
for upcoming session dates."""

[[sections]]
title = "Built for Professionals"
body = """CamMatch™ Professional is designed for accident reconstruction \
engineers, forensic engineers, engineering consultants, government \
agencies, law enforcement, universities, researchers, and professional \
visualization specialists."""

[[sections]]
title = "OpenCV installs automatically"
body = """CamMatch uses OpenCV (the cv2 library) for its computer-vision math, \
but you don't install it separately. On first run, click Install OpenCV in the \
CamMatch add-on preferences and it sets itself up — from the copy bundled with \
the add-on, or from the internet if needed — on Windows, macOS, and Linux, and \
across every Blender Python version, including Blender 5.1 on Python 3.13.

If a machine is offline or behind a strict corporate firewall that blocks the \
download, the User Guide's Troubleshooting section has a one-line manual install \
into Blender's own Python. After installing, restart Blender and click \
Diagnostics in the CamMatch panel."""

