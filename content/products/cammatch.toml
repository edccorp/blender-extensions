pitch = """CamMatch™ Professional is a professional camera matching solution \
developed for accident reconstruction, forensic engineering, and technical \
visualization. Built as a native Blender add-on and powered by OpenCV, it \
provides an efficient workflow for camera calibration, camera pose \
estimation, lens distortion correction, reprojection analysis, and forensic \
visualization — all inside Blender."""

